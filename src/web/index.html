<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Эхо</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #16130f;
      --panel: #221c16;
      --ink: #f4efe4;
      --muted: #b3a894;
      --line: #3a3128;
      --accent: #e0a15a;
      --ok: #8fbf8a;
      --bad: #d67b6a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    }
    header, main, aside { padding: 1.25rem; }
    header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: end;
      border-bottom: 1px solid var(--line);
    }
    .mark { margin: 0; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.75rem; }
    h1 { margin: 0.15rem 0 0; font-weight: 500; font-size: 2rem; }
    #health { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: flex-end; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.6rem; color: var(--muted); font-size: 0.85rem; }
    .chip.ok { color: var(--ok); border-color: #3d5a3c; }
    .chip.bad { color: var(--bad); border-color: #6a3d34; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: calc(100vh - 92px); }
    main { display: flex; flex-direction: column; min-height: calc(100vh - 92px); }
    #log { flex: 1; display: flex; flex-direction: column; gap: 0.8rem; }
    #composer {
      position: sticky;
      bottom: 0;
      background: var(--bg);
      padding-bottom: 0.4rem;
    }
    article { max-width: 42rem; }
    article.user { margin-left: auto; }
    article p { margin: 0; white-space: pre-wrap; }
    article.user p { background: #2c241c; border-radius: 0.8rem 0.8rem 0.2rem 0.8rem; padding: 0.7rem 0.85rem; }
    article.assistant p { padding: 0.15rem 0; }
    .meta { color: var(--muted); font-size: 0.82rem; margin-top: 0.25rem; }
    .trace { margin: 0.35rem 0 0; padding-left: 1rem; color: var(--muted); font-size: 0.85rem; }
    form { display: grid; gap: 0.7rem; }
    textarea, input, select, button {
      font: inherit;
      color: inherit;
      background: #2a241d;
      border: 1px solid var(--line);
      border-radius: 0.55rem;
      padding: 0.55rem 0.7rem;
    }
    textarea { min-height: 5.5rem; resize: vertical; }
    button { background: var(--accent); color: #23180d; border: 0; cursor: pointer; }
    button.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button:disabled { opacity: 0.55; cursor: wait; }
    .row { display: flex; gap: 0.5rem; align-items: center; }
    .row > * { flex: 1; }
    aside { border-left: 1px solid var(--line); background: var(--panel); }
    aside h2 { margin: 0.4rem 0; font-size: 1rem; font-weight: 500; }
    label { display: grid; gap: 0.25rem; color: var(--muted); font-size: 0.85rem; }
    #status { min-height: 1.2rem; color: var(--muted); }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
      header { align-items: start; flex-direction: column; }
      #health { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="mark">личный агент</p>
      <h1>Эхо</h1>
    </div>
    <div id="health"></div>
  </header>
  <div class="layout">
    <main>
      <section id="log" aria-live="polite"></section>
      <form id="composer">
        <label>Реплика
          <textarea id="prompt" placeholder="Спроси или попроси сделать"></textarea>
        </label>
        <div class="row">
          <select id="provider" aria-label="Мозг">
            <option value="">Цепочка</option>
            <option value="local">Локальная модель</option>
            <option value="groq">Groq</option>
            <option value="openrouter">OpenRouter</option>
          </select>
          <button id="send" type="submit">Спросить</button>
        </div>
        <p id="status"></p>
      </form>
    </main>
    <aside>
      <form id="settings">
        <h2>Локальная модель</h2>
        <label>Base URL
          <input id="local-url" autocomplete="off" spellcheck="false">
        </label>
        <label>Модель
          <input id="local-model" autocomplete="off" spellcheck="false">
        </label>
        <button class="quiet" type="button" data-probe="local">Проверить локальную</button>

        <h2>Groq</h2>
        <label>Модель
          <input id="groq-model" autocomplete="off" spellcheck="false">
        </label>
        <label>Ключ
          <input id="groq-key" type="password" autocomplete="off" placeholder="пусто — не менять">
        </label>
        <button class="quiet" type="button" data-probe="groq">Проверить Groq</button>

        <h2>OpenRouter</h2>
        <label>Модель
          <input id="openrouter-model" autocomplete="off" spellcheck="false">
        </label>
        <label>Ключ
          <input id="openrouter-key" type="password" autocomplete="off" placeholder="пусто — не менять">
        </label>
        <button class="quiet" type="button" data-probe="openrouter">Проверить OpenRouter</button>

        <label>Порядок цепочки
          <input id="chain" spellcheck="false">
        </label>
        <p class="meta">Проверка смотрит уже сохранённые настройки. Ключ в ответе сервера не возвращается.</p>
        <button type="submit">Сохранить</button>
      </form>
    </aside>
  </div>
  <script>
    const log = document.querySelector("#log");
    const status = document.querySelector("#status");
    const health = document.querySelector("#health");
    const prompt = document.querySelector("#prompt");
    const provider = document.querySelector("#provider");

    function say(text) { status.textContent = text; }

    function addMessage(role, text, meta, trace) {
      const article = document.createElement("article");
      article.className = role;
      const body = document.createElement("p");
      body.textContent = text;
      article.append(body);
      if (meta) {
        const note = document.createElement("div");
        note.className = "meta";
        note.textContent = meta;
        article.append(note);
      }
      if (trace && trace.length) {
        const list = document.createElement("ul");
        list.className = "trace";
        for (const step of trace) {
          const item = document.createElement("li");
          item.textContent = `${step.name}: ${step.content}`;
          list.append(item);
        }
        article.append(list);
      }
      log.append(article);
      article.scrollIntoView({ block: "nearest" });
    }

    async function readJson(response) {
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Ошибка");
      return data;
    }

    async function refresh() {
      const settings = await readJson(await fetch("/api/settings"));
      document.querySelector("#local-url").value = settings.local.baseUrl;
      document.querySelector("#local-model").value = settings.local.model;
      document.querySelector("#groq-model").value = settings.groq.model;
      document.querySelector("#openrouter-model").value = settings.openrouter.model;
      document.querySelector("#groq-key").placeholder = settings.groq.hasKey ? "ключ задан" : "нет ключа";
      document.querySelector("#openrouter-key").placeholder = settings.openrouter.hasKey ? "ключ задан" : "нет ключа";
      document.querySelector("#chain").value = settings.chain.join(", ");
      const doctor = await readJson(await fetch("/api/doctor"));
      health.replaceChildren();
      for (const slot of doctor.slots) {
        const chip = document.createElement("span");
        chip.className = `chip ${slot.ok ? "ok" : "bad"}`;
        chip.textContent = `${slot.id}: ${slot.ok ? "жив" : "молчит"}`;
        health.append(chip);
      }
    }

    document.querySelector("#composer").addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = prompt.value.trim();
      if (!text) return;
      const chosen = provider.value;
      addMessage("user", text);
      prompt.value = "";
      document.querySelector("#send").disabled = true;
      say("Думаю…");
      try {
        const reply = await readJson(await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text, provider: chosen }),
        }));
        const who = reply.provider.model ? `${reply.provider.llm} · ${reply.provider.model}` : reply.provider.llm;
        addMessage("assistant", reply.text, who, reply.toolTrace);
        say("");
      } catch (error) {
        say(error.message);
      } finally {
        document.querySelector("#send").disabled = false;
      }
    });

    prompt.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        document.querySelector("#composer").requestSubmit();
      }
    });

    document.querySelector("#settings").addEventListener("submit", async (event) => {
      event.preventDefault();
      const chain = document.querySelector("#chain").value.split(",").map((item) => item.trim()).filter(Boolean);
      const body = {
        chain,
        local: {
          baseUrl: document.querySelector("#local-url").value,
          model: document.querySelector("#local-model").value,
        },
        groq: { model: document.querySelector("#groq-model").value },
        openrouter: { model: document.querySelector("#openrouter-model").value },
      };
      const groqKey = document.querySelector("#groq-key").value;
      const openrouterKey = document.querySelector("#openrouter-key").value;
      if (groqKey.trim()) body.groq.apiKey = groqKey;
      if (openrouterKey.trim()) body.openrouter.apiKey = openrouterKey;
      say("Сохраняю…");
      try {
        await readJson(await fetch("/api/settings", {
          method: "PUT",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        }));
        document.querySelector("#groq-key").value = "";
        document.querySelector("#openrouter-key").value = "";
        await refresh();
        say("Настройки в доме данных.");
      } catch (error) {
        say(error.message);
      }
    });

    for (const button of document.querySelectorAll("[data-probe]")) {
      button.addEventListener("click", async () => {
        say("Проверяю…");
        try {
          const result = await readJson(await fetch("/api/probe", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ provider: button.dataset.probe }),
          }));
          say(result.ok ? `Отвечает: ${result.detail}` : "Не отвечает");
          await refresh();
        } catch (error) {
          say(error.message);
        }
      });
    }

    refresh().catch((error) => say(error.message));
  </script>
</body>
</html>
